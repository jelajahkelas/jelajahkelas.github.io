# Diagnosa akun (hanya membaca data), dijalankan manual. Hasil terenkripsi.
name: Cek akun
on:
  workflow_dispatch:
    inputs:
      docs: { description: 'dokumen', default: '' }
      uids: { description: 'uid', default: '' }
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save google-auth-library@9 >/dev/null 2>&1 && node .github/scripts/cek.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CEK_DOCS: ${{ github.event.inputs.docs }}
          CEK_UIDS: ${{ github.event.inputs.uids }}
      - uses: actions/upload-artifact@v4
        with: { name: diag, path: diag.json, retention-days: 1 }
