# Pemasang otomatis JELAS.
# Setiap kali aturan database (firestore.rules) atau kode server (notif/worker.js) berubah,
# GitHub memasangnya ke Firebase dan Cloudflare. Kunci disimpan di
# Settings → Secrets and variables → Actions (tidak pernah ditulis di file ini).
name: Pasang otomatis
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'notif/**', '.github/**']
  workflow_dispatch:
jobs:
  aturan-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save google-auth-library@9
      - name: Pasang aturan Firestore
        run: node .github/scripts/aturan.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  server-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang kode server Cloudflare
        working-directory: notif
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cdc1583c52c69fc53e4556bd554d49cb' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Kunci Cloudflare belum diisi di GitHub Secrets, langkah ini dilewati."; exit 0; fi
          # ambil token saja walau yang ditempel berisi teks lain (mis. CLOUDFLARE_API_TOKEN=... atau Account ID)
          RAW="$CLOUDFLARE_API_TOKEN"; TOK="$(printf '%s' "$RAW" | sed 's/CLOUDFLARE_API_TOKEN//g' | grep -oE '[A-Za-z0-9_-]{30,}' | grep -vE '^[0-9a-f]{32}$' | head -1)"
          echo "Isi secret: $(printf '%s' "$RAW" | wc -c) karakter; token ditemukan: ${#TOK} karakter"
          export CLOUDFLARE_API_TOKEN="${TOK:-$RAW}"
          npx --yes wrangler@3 deploy
      - name: Kirim kunci Firebase ke server notifikasi
        working-directory: notif
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cdc1583c52c69fc53e4556bd554d49cb' }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$SA" ]; then
            echo "Kunci belum lengkap, langkah ini dilewati."; exit 0; fi
          # ambil token saja walau yang ditempel berisi teks lain (mis. CLOUDFLARE_API_TOKEN=... atau Account ID)
          RAW="$CLOUDFLARE_API_TOKEN"; TOK="$(printf '%s' "$RAW" | sed 's/CLOUDFLARE_API_TOKEN//g' | grep -oE '[A-Za-z0-9_-]{30,}' | grep -vE '^[0-9a-f]{32}$' | head -1)"
          echo "Isi secret: $(printf '%s' "$RAW" | wc -c) karakter; token ditemukan: ${#TOK} karakter"
          export CLOUDFLARE_API_TOKEN="${TOK:-$RAW}"
          printf '%s' "$SA" | npx --yes wrangler@3 secret put SERVICE_ACCOUNT
